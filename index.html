<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Cup FINAL WORKING</title>

<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  padding:20px;
}

.group{margin-bottom:20px;}
.title{color:#38bdf8;}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 0;
}

.flag{
  width:50px;
  height:30px;
}

.table-row{
  display:flex;
  justify-content:space-between;
  background:#1e293b;
  padding:5px;
  margin:2px 0;
}

.first{background:gold;color:black;}

.bracket{
  display:flex;
  gap:15px;
}

.round{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.match{
  background:#1e293b;
  padding:6px;
  cursor:pointer;
  text-align:center;
}

.match img{
  width:45px;
  margin:2px;
}
</style>

</head>

<body>

<h1>🏆 世界盃系統（完整）</h1>

<h2>🌍 小組</h2>
<div id="groups"></div>

<button id="genBtn">👉 生成16強</button>

<h2>🏁 淘汰賽</h2>

<div class="bracket">
<div class="round"><b>16強</b><div id="r16"></div></div>
<div class="round"><b>8強</b><div id="qf"></div></div>
<div class="round"><b>4強</b><div id="sf"></div></div>
<div class="round"><b>決賽</b><div id="final"></div></div>
<div class="round"><b>冠軍</b><div id="champion"></div></div>
</div>

<script>

// ✅ 32隊
const groups={
A:["qa","ec","sn","nl"],
B:["gb-eng","us","gb-wls","ir"],
C:["ar","sa","mx","pl"],
D:["fr","dk","tn","au"],
E:["es","de","jp","cr"],
F:["be","hr","ma","ca"],
G:["br","ch","rs","cm"],
H:["pt","uy","kr","gh"]
};

const store={};
const container=document.getElementById("groups");

// ✅ 建小組
Object.keys(groups).forEach(g=>{

  let wrap=document.createElement("div");
  wrap.className="group";

  let title=document.createElement("div");
  title.className="title";
  title.innerText="Group "+g;
  wrap.appendChild(title);

  let data=[];

  groups[g].forEach(code=>{
    data.push({code,points:0});
  });

  data.forEach(team=>{

    let row=document.createElement("div");
    row.className="row";

    let img=document.createElement("img");
    img.src="https://flagcdn.com/w80/"+team.code+".png";
    img.className="flag";

    let btn=document.createElement("button");
    btn.innerText="+3";

    btn.addEventListener("click",()=>{
      team.points+=3;
      render(g);
    });

    row.appendChild(img);
    row.appendChild(btn);
    wrap.appendChild(row);
  });

  let table=document.createElement("div");
  wrap.appendChild(table);

  store[g]={data,table};

  container.appendChild(wrap);

  render(g);
});

// ✅ 排名
function render(g){

  let d=store[g];
  d.data.sort((a,b)=>b.points-a.points);

  d.table.innerHTML="";

  d.data.forEach((t,i)=>{

    let r=document.createElement("div");
    r.className="table-row"+(i===0?" first":"");

    let img=document.createElement("img");
    img.src="https://flagcdn.com/w80/"+t.code+".png";
    img.className="flag";

    let score=document.createElement("span");
    score.innerText=t.points;

    r.appendChild(img);
    r.appendChild(score);

    d.table.appendChild(r);
  });
}

// ✅ 生成16強
document.getElementById("genBtn").addEventListener("click",()=>{

  document.getElementById("r16").innerHTML="";
  document.getElementById("qf").innerHTML="";
  document.getElementById("sf").innerHTML="";
  document.getElementById("final").innerHTML="";
  document.getElementById("champion").innerHTML="";

  let map={};

  Object.keys(groups).forEach(g=>{
    let arr=[...store[g].data].sort((a,b)=>b.points-a.points);
    map[g+"1"]=arr[0];
    map[g+"2"]=arr[1];
  });

  let pairs=[
   [map.A1,map.B2],[map.B1,map.A2],
   [map.C1,map.D2],[map.D1,map.C2],
   [map.E1,map.F2],[map.F1,map.E2],
   [map.G1,map.H2],[map.H1,map.G2]
  ];

  buildRound("r16",pairs,"qf");
});

// ✅ 建比賽（互動）
function buildRound(stage,list,next){

  let box=document.getElementById(stage);

  list.forEach(pair=>{

    let div=document.createElement("div");
    div.className="match";

    let left=document.createElement("img");
    left.src="https://flagcdn.com/w80/"+pair[0].code+".png";

    let right=document.createElement("img");
    right.src="https://flagcdn.com/w80/"+pair[1].code+".png";

    div.appendChild(left);
    div.appendChild(right);

    // ✅ 直接點旗選勝方
    left.onclick=(e)=>{
      e.stopPropagation();
      advance(pair[0],next);
    };

    right.onclick=(e)=>{
      e.stopPropagation();
      advance(pair[1],next);
    };

    box.appendChild(div);
  });
}

// ✅ 晉級
function advance(team,next){

  if(next==="qf") push(team,"qf","sf");
  else if(next==="sf") push(team,"sf","final");
  else if(next==="final") push(team,"final","champion");
  else{
    let c=document.getElementById("champion");
    c.innerHTML="";
    let img=document.createElement("img");
    img.src="https://flagcdn.com/w80/"+team.code+".png";
    img.className="flag";
    c.appendChild(img);
  }
}

// ✅ 加入下一輪
function push(team,stage,next){

  let div=document.createElement("div");
  div.className="match";

  let img=document.createElement("img");
  img.src="https://flagcdn.com/w80/"+team.code+".png";

  div.appendChild(img);

  img.onclick=(e)=>{
    e.stopPropagation();
    advance(team,next);
  };

  document.getElementById(stage).appendChild(div);
}

</script>

</body>
</html>
