<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Cup FINAL PRO</title>

<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  padding:20px;
}

/* ✅ 分組布局 */
.groups{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
@media(max-width:900px){.groups{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.groups{grid-template-columns:1fr;}}

.group{
  background:#111827;
  padding:10px;
  border-radius:8px;
}
.title{color:#38bdf8;}

.row{
  display:flex;
  align-items:center;
  gap:6px;
  margin:3px 0;
}

.flag{
  width:40px;
  height:26px;
}

/* ✅ 分數鍵（升級） */
button{
  border:none;
  border-radius:6px;
  padding:4px 6px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.win{ background:#22c55e;}
.draw{ background:#eab308;}
.lose{ background:#334155;color:white;}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 6px cyan;
}

button:active{
  transform:scale(0.9);
}

/* ✅ 排名 */
.table-row{
  display:flex;
  justify-content:space-between;
  background:#1e293b;
}
.first{background:gold;color:black;}

/* ✅ SVG bracket */
.stage{
  position:relative;
  height:600px;
  margin-top:30px;
}

svg{
  position:absolute;
  width:100%;
  height:100%;
}

.node{
  position:absolute;
}

.node img{
  width:40px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🏆 WORLD CUP</h1>

<h2>🌍 小組</h2>
<div id="groups" class="groups"></div>

<button onclick="start()">👉 開始淘汰賽</button>

<h2>🏁 淘汰賽</h2>

<div class="stage" id="stage">
  <svg id="svg"></svg>
</div>

<script>

/* ✅ 32隊 */
const groups={
A:["qa","ec","sn","nl"],
B:["gb-eng","us","gb-wls","ir"],
C:["ar","sa","mx","pl"],
D:["fr","dk","tn","au"],
E:["es","de","jp","cr"],
F:["be","hr","ma","ca"],
G:["br","ch","rs","cm"],
H:["pt","uy","kr","gh"]
};

const store={};
const root=document.getElementById("groups");

/* ✅ 建小組 */
Object.keys(groups).forEach(g=>{

 let box=document.createElement("div");
 box.className="group";
 box.innerHTML='<div class="title">Group '+g+'</div>';

 let data=[];

 groups[g].forEach(code=>{
   data.push({code,points:0});
 });

 data.forEach(team=>{

  let row=document.createElement("div");
  row.className="row";

  let img=document.createElement("img");
  img.src="https://flagcdn.com/w80/"+team.code+".png";
  img.className="flag";

  let b3=document.createElement("button");
  b3.innerText="+3"; b3.className="win";
  b3.onclick=()=>{team.points+=3;update(g);};

  let b1=document.createElement("button");
  b1.innerText="+1"; b1.className="draw";
  b1.onclick=()=>{team.points+=1;update(g);};

  let b0=document.createElement("button");
  b0.innerText="+0"; b0.className="lose";
  b0.onclick=()=>{update(g);};

  row.append(img,b3,b1,b0);
  box.appendChild(row);
 });

 let table=document.createElement("div");
 box.appendChild(table);

 store[g]={data,table};
 root.appendChild(box);

 update(g);
});

/* ✅ 排名 */
function update(g){

 let d=store[g];
 d.data.sort((a,b)=>b.points-a.points);

 d.table.innerHTML="";

 d.data.forEach((t,i)=>{

  let r=document.createElement("div");
  r.className="table-row"+(i===0?" first":"");

  let img=document.createElement("img");
  img.src="https://flagcdn.com/w80/"+t.code+".png";
  img.className="flag";

  let s=document.createElement("span");
  s.innerText=t.points;

  r.append(img,s);
  d.table.appendChild(r);
 });
}

/* ✅ SVG bracket */
const svg=document.getElementById("svg");
const stage=document.getElementById("stage");

/* ✅ 對齊 */
function pos(round,index){
 return {
  x:50+round*180,
  y:30+index*(60*Math.pow(2,round))
 };
}

/* ✅ 開始 */
function start(){

 stage.querySelectorAll(".node").forEach(n=>n.remove());
 svg.innerHTML="";

 let m={};

 Object.keys(groups).forEach(g=>{
  let a=[...store[g].data].sort((a,b)=>b.points-a.points);
  m[g+"1"]=a[0];
  m[g+"2"]=a[1];
 });

 let list=[
  [m.A1,m.B2],[m.B1,m.A2],
  [m.C1,m.D2],[m.D1,m.C2],
  [m.E1,m.F2],[m.F1,m.E2],
  [m.G1,m.H2],[m.H1,m.G2]
 ];

 draw(list,0);
}

/* ✅ 畫輪 */
function draw(list,r){

 list.forEach((p,i)=>{

  let p1=pos(r,i*2);
  let p2=pos(r,i*2+1);

  let n1=node(p[0],p1);
  let n2=node(p[1],p2);

  n1.onclick=()=>advance(p[0],p1,r,i);
  n2.onclick=()=>advance(p[1],p2,r,i);
 });
}

/* ✅ node */
function node(team,p){

 let d=document.createElement("div");
 d.className="node";
 d.style.left=p.x+"px";
 d.style.top=p.y+"px";

 let img=document.createElement("img");
 img.src="https://flagcdn.com/w80/"+team.code+".png";

 d.appendChild(img);
 stage.appendChild(d);

 return img;
}

/* ✅ 晉級 */
function advance(team,p,r,i){

 let nr=r+1;

 let np={
   x:p.x+180,
   y:Math.floor(i/2)*(60*Math.pow(2,nr))+40
 };

 let n=node(team,np);

 line(p,np);

 n.onclick=()=>advance(team,np,nr,Math.floor(i/2));
}

/* ✅ 曲線 + 動畫 */
function line(a,b){

 let path=document.createElementNS("http://www.w3.org/2000/svg","path");

 let d=`M${a.x+40},${a.y+13}
        C${a.x+90},${a.y+13}
         ${b.x-70},${b.y+13}
         ${b.x},${b.y+13}`;

 path.setAttribute("d",d);
 path.setAttribute("stroke","white");
 path.setAttribute("fill","none");
 path.setAttribute("stroke-width","2");

 path.style.strokeDasharray="200";
 path.style.strokeDashoffset="200";
 path.style.animation="draw 0.5s linear forwards";

 svg.appendChild(path);
}

/* ✅ 動畫 */
let style=document.createElement("style");
style.innerHTML="@keyframes draw{to{stroke-dashoffset:0;}}";
document.head.appendChild(style);

</script>

</body>
</html>
